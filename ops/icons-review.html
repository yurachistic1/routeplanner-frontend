<!DOCTYPE html>
<!-- For looking over the GPS art icons: every icon, with the ones the build
     would leave out marked with the reason. Make the data it shows with
     python3 ops/build-icons.py --all   (writes assets/icons-all.json)
     and open this page from the local server:
     http://localhost:5173/ops/icons-review.html
     ?show=kept (default), out or all; ?page=N for N'th 216; ?q=word. -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Icons review</title>
<style>
  body { margin: 0; padding: 6px; background: #10141c; color: #e9eef5; font: 9px/1.1 system-ui, sans-serif; }
  #grid { display: grid; grid-template-columns: repeat(27, 1fr); gap: 3px; }
  .t { display: grid; justify-items: center; gap: 1px; padding: 3px 0 2px; border: 1px solid #2a3140; border-radius: 4px; overflow: hidden; }
  .t svg { width: 40px; height: 40px; fill: none; stroke: #c8ff2e; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
  .t span { max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #aab4c4; }
  .t.out { border-color: #6b2a2a; } .t.out svg { stroke: #ff8a7a; } .t i { color: #ff8a7a; font-style: normal; }
</style>
</head>
<body>
<div id="grid"></div>
<script type="module">
  const q = new URLSearchParams(location.search);
  const show = q.get("show") ?? "kept", page = +(q.get("page") ?? 0), word = q.get("q") ?? "";
  const all = await (await fetch("../assets/icons-all.json", { cache: "reload" })).json();
  const icons = all.filter(([name, , , why]) => (show === "all" || (show === "kept") === !why) && name.includes(word));
  document.title = `${icons.length} icons (${show})`;
  document.getElementById("grid").innerHTML = icons.slice(page * 216, (page + 1) * 216).map(([name, , strokes, why]) =>
    `<div class="t${why ? " out" : ""}" title="${name}"><svg viewBox="-1 -1 26 26">${strokes.map((s) =>
      `<polyline points="${s.map((p) => p.join(",")).join(" ")}"/>`).join("")}</svg><span>${name}</span>${why ? `<i>${why}</i>` : ""}</div>`).join("");
</script>
</body>
</html>
